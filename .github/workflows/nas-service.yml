name: NAS photo service
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zalbum
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zalbum"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: nas-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          RUN_DISPOSABLE_PG_TEST: '1'
      - run: docker compose config --quiet
        env:
          PHOTO_ROOT: /tmp/photopainter-ci
      - run: docker build -t photopainter-ci .
      - name: Container health
        run: |
          docker run -d --name photopainter-ci -p 18080:8080 photopainter-ci
          trap 'docker rm -f photopainter-ci' EXIT
          for i in $(seq 1 20); do
            if curl --fail http://127.0.0.1:18080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs photopainter-ci
          exit 1
